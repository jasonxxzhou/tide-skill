name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Quality check (Paul Graham example)
        run: python scripts/quality_check.py examples/paul-graham-perspective/SKILL.md

      - name: Quality check (Adler example)
        run: python scripts/quality_check.py examples/adler-perspective/SKILL.md

      - name: Syntax check all scripts
        run: |
          python -m py_compile scripts/quality_check.py
          python -m py_compile scripts/compile-prompt.py
          python -m py_compile scripts/douyin_extractor.py
